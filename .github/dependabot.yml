version: 2
updates:
  # Major npm upgrades (Next.js, ESLint, TypeScript, Vitest) need a deliberate
  # migration, so Dependabot proposes only minor and patch updates, grouped.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
